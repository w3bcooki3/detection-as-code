name: Investigate a Windows log
description: Scan Windows event logs with verified and SigmaHQ rules and get an incident report in a few minutes.
title: "Investigate: "
labels: ["investigate"]
body:
  - type: markdown
    attributes:
      value: |
        The bot scans the logs with this repo's verified rules plus the SigmaHQ community rules, enriches what it finds with threat intel, and replies with an incident report.
        **On the public demo, use sample attacks only.** For real logs, use your own private copy of this repo (see the README).
  - type: dropdown
    id: sample
    attributes:
      label: Sample attack
      description: Pick a recorded attack from EVTX-ATTACK-SAMPLES, or choose "My own log" and attach a zip below.
      options:
        - Mimikatz stealing passwords from LSASS
        - LSASS memory dump with comsvcs.dll
        - PsExec lateral movement with Meterpreter
        - Security event log cleared
        - Clean activity (should find nothing)
        - My own log (attached below)
    validations:
      required: true
  - type: textarea
    id: upload
    attributes:
      label: Your own log (optional)
      description: Drag in the zip made by collect.ps1, or any zip of up to 10 .evtx files (25 MB max).

# Response playbook: what to do when a detection for each ATT&CK technique fires.
# The triage bot reads this file. Edit the steps here, not in code.
techniques:
  T1003.001:
    name: OS Credential Dumping - LSASS Memory
    tactic: Credential Access
    stage: Actions on objectives
    severity: critical
    why: Attacker is stealing passwords and hashes from memory. Every account that logged on to this host should be treated as exposed.
    contain:
      - Isolate the host from the network with your EDR
      - Reset passwords for every account that logged on to the host, starting with admins
      - Hunt for the same tool or command line on other hosts in the SIEM
      - Look for new logons from these accounts in the next 72 hours
  T1059.001:
    name: Command and Scripting Interpreter - PowerShell
    tactic: Execution
    stage: Installation
    severity: high
    why: Hidden, profile-less PowerShell is how most stagers and loaders start. Check what it ran and what it connected to.
    contain:
      - Pull the full command line and any PowerShell 4104 script block logs
      - Check network connections from the PowerShell process and block the destination
      - Review the parent process to find the initial access path
      - Isolate the host if a payload was downloaded or injected
  T1070.001:
    name: Indicator Removal - Clear Windows Event Logs
    tactic: Defense Evasion
    stage: Actions on objectives
    severity: high
    why: Someone wiped the evidence. Clearing the Security log is rare outside planned maintenance.
    contain:
      - Confirm with the change calendar whether this was planned maintenance
      - Pull forwarded copies of the logs from the SIEM before they age out
      - Identify the account that cleared the log and review its recent activity
      - Treat the host as compromised until proven otherwise
severity_order: [info, low, medium, high, critical]
routing:
  critical: escalate to incident response now
  high: escalate to tier 2 within 1 hour
  medium: tier 1 review within 4 hours
  low: tier 1 review within 24 hours
  info: auto-close after review
# Fallback when a community rule fires for a technique with no specific entry above.
tactics:
  initial-access:
    tactic: Initial Access
    severity: high
    why: Something may have just gotten in. Find the entry point before it is reused.
    contain:
      - Identify the entry point (email, exposed service, removable media, valid account)
      - Block the source and reset any credentials used
  execution:
    tactic: Execution
    severity: medium
    why: Code ran in a way attackers often use. Confirm what ran and who started it.
    contain:
      - Review the full command line and parent process
      - Check the host for persistence and outbound connections around the same time
  persistence:
    tactic: Persistence
    severity: high
    why: Something set itself up to survive a reboot.
    contain:
      - Remove the persistence item (service, scheduled task, run key) after collecting evidence
      - Find what created it and check other hosts for the same item
  privilege-escalation:
    tactic: Privilege Escalation
    severity: high
    why: A process may have gained higher rights than it should have.
    contain:
      - Identify the account and process that gained privileges
      - Check for new admin accounts or group membership changes
  defense-evasion:
    tactic: Defense Evasion
    severity: high
    why: Something tried to hide or disable security controls.
    contain:
      - Confirm security tools and logging are still running on the host
      - Pull forwarded logs from the SIEM in case local logs were tampered with
  credential-access:
    tactic: Credential Access
    severity: critical
    why: Credentials may have been stolen.
    contain:
      - Isolate the host and reset passwords for accounts used on it
      - Watch for those accounts logging on elsewhere
  discovery:
    tactic: Discovery
    severity: medium
    why: Someone is mapping the environment, often a step before lateral movement.
    contain:
      - Identify the account running the discovery commands and whether that is normal for it
      - Look for lateral movement from this host in the following hours
  lateral-movement:
    tactic: Lateral Movement
    severity: high
    why: Activity is spreading between hosts.
    contain:
      - Identify source and destination hosts and isolate both if confirmed
      - Reset credentials used for the remote access
  collection:
    tactic: Collection
    severity: high
    why: Data may be being gathered for theft.
    contain:
      - Identify what data was accessed and where it was staged
      - Check for outbound transfers from the host
  command-and-control:
    tactic: Command and Control
    severity: high
    why: The host may be talking to an attacker.
    contain:
      - Block the destination at the proxy, firewall and DNS
      - Isolate the host and search for other hosts contacting the same destination
  exfiltration:
    tactic: Exfiltration
    severity: critical
    why: Data may be leaving the network.
    contain:
      - Block the destination and isolate the host
      - Work out what data left and start your data breach process
  impact:
    tactic: Impact
    severity: critical
    why: Something is destroying, encrypting or disrupting systems or data.
    contain:
      - Isolate affected hosts immediately to stop spread
      - Start the ransomware or disaster recovery runbook and protect backups

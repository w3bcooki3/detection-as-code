title: Suspicious Process Access to LSASS Memory
id: 8d4a1f6b-2e93-4c5d-b7a0-3f9e1c2d4a02
status: test
description: Detects a process opening LSASS with access rights used by credential dumping tools such as Mimikatz sekurlsa.
author: FNU Rahul
date: 2026-11-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_system:
    SourceImage|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Program Files\'
  condition: selection and not filter_system
falsepositives:
  - Some EDR and backup agents installed outside Program Files
level: high
